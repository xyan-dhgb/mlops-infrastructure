apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 56.6.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/modules/monitoring/prometheus/prometheus-values.yaml
    - repoURL: https://github.com/xyan-dhgb/mlops-infrastructure.git
      targetRevision: dev
      ref: values
  syncPolicy:
    # No automated sync: prometheus values file in Git contains placeholders
    # for SNS/IRSA that are rendered by phase2 during bootstrap.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # REQUIRED: Prometheus CRDs exceed 262144 bytes annotation limit
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
      jqPathExpressions:
        - .status.terminatingReplicas  # Kubernetes 1.28+ field, not in ArgoCD 7.5.2 schema → ComparisonError with SSA
    - group: monitoring.coreos.com
      kind: PrometheusRule
      jsonPointers:
        - /spec/groups
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
