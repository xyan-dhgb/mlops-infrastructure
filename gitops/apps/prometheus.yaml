apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # ServerSideApply=true otherwise triggers ArgoCD's structured-merge diff,
    # which can fail on newer Kubernetes status fields such as
    # .status.terminatingReplicas.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 56.6.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/modules/monitoring/prometheus/prometheus-values.yaml
    - repoURL: https://github.com/xyan-dhgb/mlops-infrastructure.git
      targetRevision: dev
      ref: values
  syncPolicy:
    # No automated sync: alertmanager config is managed as a K8s Secret by phase2.
    # The SNS/IRSA values are never stored in Git; phase2 creates alertmanager-sns-config
    # directly with rendered values so ArgoCD never overwrites them with __placeholders__.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:  
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
      jqPathExpressions:
        - .status.terminatingReplicas  # Kubernetes 1.28+ field, not in ArgoCD 7.5.2 schema → ComparisonError with SSA
    - group: monitoring.coreos.com
      kind: PrometheusRule
      jsonPointers:
        - /spec/groups
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # phase2 patches the real IRSA ARN onto this SA after Helm install.
    # ArgoCD must not revert it back to the __placeholder__ from Git.
    - group: ""
      kind: ServiceAccount
      name: alertmanager-sns
      namespace: prometheus
      jsonPointers:
        - /metadata/annotations/eks.amazonaws.com~1role-arn
