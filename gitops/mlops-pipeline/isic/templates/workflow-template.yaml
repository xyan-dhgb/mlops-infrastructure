apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: isic-ml-pipeline
  namespace: {{ .Values.global.namespace }}
  labels:
    {{ include "isic-ml-pipeline.labels" . | nindent 4 }}
spec:
  serviceAccountName: isic-ml-workflow
  entrypoint: pipeline
  activeDeadlineSeconds: 21600
  retryStrategy:
    limit: "2"
    retryPolicy: Always

  arguments:
    parameters:
      - name: IMAGE_TAG
        value: {{ .Values.global.imageTag | quote }}

  templates:
    # ── DAG ────────────────────────────────────────────────────────────────────
    - name: pipeline
      dag:
        tasks:
          # 1. Download both image dataset + CSV from Kaggle (single step, single image)
          - name: download-data
            template: download-data

          # 2. Preprocess image and CSV in parallel — each has its own ECR image
          - name: preprocess-image
            dependencies: [download-data]
            template: preprocess-image
          - name: preprocess-csv
            dependencies: [download-data]
            template: preprocess-csv

          # 3. Shared dataloader — loads image + CSV, performs 64/16/20 split
          #    Single script, single image, handles both modalities
          - name: dataloader
            dependencies: [preprocess-image, preprocess-csv]
            template: dataloader

          # 4. Build model branches in parallel from dataloader output
          - name: build-efficientnetb3
            dependencies: [dataloader]
            template: build-efficientnetb3
          - name: build-mlp
            dependencies: [dataloader]
            template: build-mlp

          # 5. Combine branches into multimodal model (fusion head)
          - name: build-multimodal-model
            dependencies: [build-efficientnetb3, build-mlp]
            template: build-multimodal-model

          # 6. Train → Evaluate → Gate → XAI + Register (sequential → parallel)
          - name: train
            dependencies: [build-multimodal-model]
            template: train
          - name: evaluate
            dependencies: [train]
            template: evaluate
          - name: validate-metrics
            dependencies: [evaluate]
            template: validate-metrics
          - name: xai
            dependencies: [validate-metrics]
            template: xai

    # ── Step: download-data ─────────────────────────────────────────────────────
    # Node: general — download both image dataset + CSV from Kaggle in one step
    - name: download-data
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.prepareData }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "prepare_data.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "1",    memory: "2Gi"}
      nodeSelector:
        role: general

    # ── Step: preprocess-image ──────────────────────────────────────────────────
    # Node: cpu-ml — CLAHE, Gaussian, contrast enhancement on raw images (I/O heavy)
    - name: preprocess-image
      activeDeadlineSeconds: 10800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.preprocessImage }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "preprocess_image.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "6", memory: "12Gi"}
          limits:   {cpu: "8", memory: "15Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: preprocess-csv ────────────────────────────────────────────────────
    # Node: cpu-ml — fit scaler/encoder on train split, transform val/test
    - name: preprocess-csv
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.preprocessCsv }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "preprocess_csv.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits:   {cpu: "4", memory: "8Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: dataloader ────────────────────────────────────────────────────────
    # Node: cpu-ml — shared dataloader for image + CSV, performs 64/16/20 split
    # Single script handles both modalities and aligns isic_id across branches
    - name: dataloader
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.dataloader }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "dataloader.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits:   {cpu: "4", memory: "8Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: build-efficientnetb3 ──────────────────────────────────────────────
    # Node: cpu-ml — build CNN branch (EfficientNetB3) from preprocessed images
    # Runs in parallel with build-mlp
    - name: build-efficientnetb3
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.buildEfficientnetb3 }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "build_efficientnetb3.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "1", memory: "4Gi"}
          limits:   {cpu: "2", memory: "6Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: build-mlp ────────────────────────────────────────────────────────
    # Node: cpu-ml — build tabular branch (MLP) from preprocessed CSV features
    # Runs in parallel with build-efficientnetb3
    - name: build-mlp
      activeDeadlineSeconds: 900
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.buildMlp }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "build_mlp.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "1",    memory: "2Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: build-multimodal-model ───────────────────────────────────────────
    # Node: general — Concatenate EfficientNetB3 + MLP → Fusion head
    - name: build-multimodal-model
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.buildEfficientnetb3 }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "build_multimodal_model.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "1", memory: "4Gi"}
          limits:   {cpu: "2", memory: "6Gi"}
      nodeSelector:
        role: general

    # ── Step: train ────────────────────────────────────────────────────────────
    # Node: gpu (g4dn.xlarge NVIDIA T4) — Phase1 frozen + Phase2 fine-tune
    - name: train
      activeDeadlineSeconds: 14400
      retryStrategy:
        limit: "1"
        retryPolicy: Always
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.train }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "train.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "3", memory: "12Gi", nvidia.com/gpu: "1"}
          limits:   {cpu: "4", memory: "15Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}

    # ── Step: evaluate ─────────────────────────────────────────────────────────
    # Node: gpu — AUC/pAUC/F1/Recall + threshold tuning on full test set
    - name: evaluate
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.evaluate }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "evaluate.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "8Gi",  nvidia.com/gpu: "1"}
          limits:   {cpu: "3", memory: "10Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}

    # ── Step: validate-metrics (GATE) ──────────────────────────────────────────
    # Node: general — exit 1 if any metric below threshold → blocks xai + register
    - name: validate-metrics
      activeDeadlineSeconds: 600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.evaluate }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "validate_metrics.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits:   {cpu: "500m", memory: "1Gi"}
      nodeSelector:
        role: general

    # ── Step: xai ──────────────────────────────────────────────────────────────
    # Node: gpu — Grad-CAM (image branch) + SHAP (tabular branch) report
    - name: xai
      activeDeadlineSeconds: 7200
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.xai }}-{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "xai_report.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "8Gi",  nvidia.com/gpu: "1"}
          limits:   {cpu: "3", memory: "12Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}
