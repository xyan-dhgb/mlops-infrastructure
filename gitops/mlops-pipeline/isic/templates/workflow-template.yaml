apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: isic-ml-pipeline
  namespace: {{ .Values.global.namespace }}
  labels:
    {{ include "isic-ml-pipeline.labels" . | nindent 4 }}
spec:
  serviceAccountName: isic-ml-workflow
  entrypoint: pipeline
  activeDeadlineSeconds: 21600
  retryStrategy:
    limit: "2"
    retryPolicy: Always

  arguments:
    parameters:
      - name: IMAGE_TAG
        value: {{ .Values.global.imageTag | quote }}

  templates:
    # ── DAG ────────────────────────────────────────────────────────────────────
    - name: pipeline
      dag:
        tasks:
          - name: download-image-dataset
            template: download-image-dataset
          - name: download-csv-dataset
            template: download-csv-dataset
          - name: create-split-manifest
            dependencies: [download-image-dataset, download-csv-dataset]
            template: create-split-manifest
          - name: preprocess-image
            dependencies: [create-split-manifest]
            template: preprocess-image
          - name: preprocess-tabular
            dependencies: [create-split-manifest]
            template: preprocess-tabular
          - name: image-dataloader
            dependencies: [preprocess-image]
            template: image-dataloader
          - name: tabular-dataloader
            dependencies: [preprocess-tabular]
            template: tabular-dataloader
          - name: build-multimodal-model
            dependencies: [image-dataloader, tabular-dataloader]
            template: build-multimodal-model
          - name: train
            dependencies: [build-multimodal-model]
            template: train
          - name: evaluate
            dependencies: [train]
            template: evaluate
          - name: validate-metrics
            dependencies: [evaluate]
            template: validate-metrics
          - name: xai
            dependencies: [validate-metrics]
            template: xai
          - name: register-model
            dependencies: [validate-metrics]
            template: register-model

    # ── Step: download-image-dataset ───────────────────────────────────────────
    # Node: general — I/O download only
    - name: download-image-dataset
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.prepareData }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "download_image_dataset.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "1",    memory: "2Gi"}
      nodeSelector:
        role: general

    # ── Step: download-csv-dataset ─────────────────────────────────────────────
    # Node: general — lightweight CSV download
    - name: download-csv-dataset
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.prepareData }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "download_csv_dataset.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits:   {cpu: "500m", memory: "1Gi"}
      nodeSelector:
        role: general

    # ── Step: create-split-manifest ────────────────────────────────────────────
    # Node: general — stratified split by isic_id+target, shared by both branches
    - name: create-split-manifest
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.prepareData }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "create_split_manifest.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "1",    memory: "2Gi"}
      nodeSelector:
        role: general

    # ── Step: preprocess-image ─────────────────────────────────────────────────
    # Node: cpu-ml (c8i-flex.2xlarge 8vCPU/16GiB) — I/O-heavy, 400k images
    - name: preprocess-image
      activeDeadlineSeconds: 10800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.preprocessImage }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "preprocess_image.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "6", memory: "12Gi"}
          limits:   {cpu: "8", memory: "15Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: preprocess-tabular ───────────────────────────────────────────────
    # Node: cpu-ml — fit scaler/encoder on train only, transform val/test
    - name: preprocess-tabular
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.preprocessCsv }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "preprocess_tabular.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits:   {cpu: "4", memory: "8Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: image-dataloader ─────────────────────────────────────────────────
    # Node: cpu-ml — validate image batches align with split manifest isic_ids
    - name: image-dataloader
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.dataloader }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "image_dataloader.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits:   {cpu: "4", memory: "8Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: tabular-dataloader ───────────────────────────────────────────────
    # Node: cpu-ml — validate tabular batches align with split manifest
    - name: tabular-dataloader
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.dataloader }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "tabular_dataloader.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "1", memory: "2Gi"}
          limits:   {cpu: "2", memory: "4Gi"}
      nodeSelector:
        role: cpu-ml
      tolerations:
        - {key: workload, operator: Equal, value: "cpu", effect: NoSchedule}

    # ── Step: build-multimodal-model ───────────────────────────────────────────
    # Node: general — EfficientNetB3 + MLP + fusion head architecture definition
    - name: build-multimodal-model
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.buildEfficientnetb3 }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "build_multimodal_model.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "1", memory: "4Gi"}
          limits:   {cpu: "2", memory: "6Gi"}
      nodeSelector:
        role: general

    # ── Step: train ────────────────────────────────────────────────────────────
    # Node: gpu (g4dn.xlarge NVIDIA T4) — Phase1 frozen + Phase2 fine-tune
    - name: train
      activeDeadlineSeconds: 14400
      retryStrategy:
        limit: "1"
        retryPolicy: Always
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.train }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "train.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "3", memory: "12Gi", nvidia.com/gpu: "1"}
          limits:   {cpu: "4", memory: "15Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}

    # ── Step: evaluate ─────────────────────────────────────────────────────────
    # Node: gpu — AUC/pAUC/F1/Recall + threshold tuning on full test set
    - name: evaluate
      activeDeadlineSeconds: 3600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.evaluate }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "evaluate.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "8Gi",  nvidia.com/gpu: "1"}
          limits:   {cpu: "3", memory: "10Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}

    # ── Step: validate-metrics (GATE) ──────────────────────────────────────────
    # Node: general — exit 1 if any metric below threshold → blocks downstream
    - name: validate-metrics
      activeDeadlineSeconds: 600
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.evaluate }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "validate_metrics.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits:   {cpu: "500m", memory: "1Gi"}
      nodeSelector:
        role: general

    # ── Step: xai ──────────────────────────────────────────────────────────────
    # Node: gpu — Grad-CAM (image branch) + SHAP (tabular branch) report
    - name: xai
      activeDeadlineSeconds: 7200
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.xai }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "xai_report.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "2", memory: "8Gi",  nvidia.com/gpu: "1"}
          limits:   {cpu: "3", memory: "12Gi", nvidia.com/gpu: "1"}
      nodeSelector:
        role: ml-pipeline
        workload: gpu-training
      tolerations:
        - {key: workload, operator: Equal, value: "ml", effect: NoSchedule}

    # ── Step: register-model ───────────────────────────────────────────────────
    # Node: general — upload model+preprocessors+metrics to MLflow + S3
    - name: register-model
      activeDeadlineSeconds: 1800
      container:
        image: "{{ .Values.global.ecrRegistry }}/{{ .Values.images.evaluate }}:{{ "{{" }}workflow.parameters.IMAGE_TAG{{ "}}" }}"
        command: ["python", "register_model.py"]
        envFrom:
          - configMapRef: {name: isic-ml-config}
          - secretRef:    {name: isic-ml-secret}
        resources:
          requests: {cpu: "250m", memory: "1Gi"}
          limits:   {cpu: "500m", memory: "2Gi"}
      nodeSelector:
        role: general
