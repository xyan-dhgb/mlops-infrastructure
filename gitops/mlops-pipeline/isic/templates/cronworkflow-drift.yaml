apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: isic-drift-monitor
  namespace: { { .Values.global.namespace } }
  labels: { { include "isic-ml-pipeline.labels" . | nindent 4 } }
spec:
  schedules:
    - { { .Values.drift.schedule | quote } }
  timezone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300

  workflowSpec:
    serviceAccountName: isic-ml-workflow
    activeDeadlineSeconds: 7200
    entrypoint: drift-pipeline

    templates:
      - name: drift-pipeline
        steps:
          - - name: drift-check
              template: drift-monitor-run

      # ── Step: drift-monitor-run ─────────────────────────────────────────────
      # drift_monitor.py đọc: baseline_profile.json
      # drift_monitor.py ghi: drift_reports/drift_report_<date>.json + HTML
      # Exit non-zero nếu overall_status == CRITICAL (phát hiện bởi sys.exit)
      - name: drift-monitor-run
        activeDeadlineSeconds: 3600
        container:
          image: "{{ .Values.global.ecrRegistry }}/{{ .Values.global.ecrRepository }}:{{ .Values.images.driftMonitor }}"
          command: ["python", "drift_monitor.py"]
          envFrom:
            - configMapRef: { name: isic-ml-config }
            - secretRef: { name: isic-ml-secret }
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits: { cpu: "4", memory: "8Gi" }
        nodeSelector:
          role: cpu-ml
        tolerations:
          - { key: workload, operator: Equal, value: "cpu", effect: NoSchedule }
