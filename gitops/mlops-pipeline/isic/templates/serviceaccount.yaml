apiVersion: v1
kind: ServiceAccount
metadata:
  name: isic-ml-workflow
  namespace: {{ .Values.global.namespace }}
  labels:
    {{ include "isic-ml-pipeline.labels" . | nindent 4 }}
  annotations:
    # Injected by CI via: kubectl patch application isic-ml-pipeline -n argocd ...
    eks.amazonaws.com/role-arn: {{ .Values.global.irsaRoleArn | quote }}
