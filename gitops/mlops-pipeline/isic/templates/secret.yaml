apiVersion: v1
kind: Secret
metadata:
  name: isic-ml-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{ include "isic-ml-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MLflow token — leave empty if MLflow does not require authentication
  MLFLOW_TRACKING_TOKEN: ""
  # AWS credentials — leave empty when using IRSA (recommended)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
