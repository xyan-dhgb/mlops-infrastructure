apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlops-demo-template
  namespace: argo-workflows
spec:
  serviceAccountName: mlops-demo-runner
  entrypoint: pipeline
  arguments:
    parameters:
      - name: dataset
        value: sample-chest-xray
      - name: model
        value: resnet18-demo
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: prepare-data
            template: run-step
            arguments:
              parameters:
                - name: stage
                  value: prepare-data
                - name: message
                  value: "Validate dataset {{workflow.parameters.dataset}} and create train/validation splits"
                - name: sleepSeconds
                  value: "8"
          - name: train-model
            dependencies:
              - prepare-data
            template: run-step
            arguments:
              parameters:
                - name: stage
                  value: train-model
                - name: message
                  value: "Train {{workflow.parameters.model}} on a tiny sample batch"
                - name: sleepSeconds
                  value: "12"
          - name: evaluate-model
            dependencies:
              - train-model
            template: run-step
            arguments:
              parameters:
                - name: stage
                  value: evaluate-model
                - name: message
                  value: "Evaluate accuracy, precision, recall, and latency"
                - name: sleepSeconds
                  value: "8"
          - name: package-report
            dependencies:
              - evaluate-model
            template: run-step
            arguments:
              parameters:
                - name: stage
                  value: package-report
                - name: message
                  value: "Package model metadata for MLflow handoff"
                - name: sleepSeconds
                  value: "6"
          - name: notify
            dependencies:
              - package-report
            template: run-step
            arguments:
              parameters:
                - name: stage
                  value: notify
                - name: message
                  value: "Send demo completion signal to the platform team"
                - name: sleepSeconds
                  value: "4"
    - name: run-step
      inputs:
        parameters:
          - name: stage
          - name: message
          - name: sleepSeconds
      container:
        image: alpine:3.20
        command:
          - sh
          - -c
        args:
          - |
            set -eu
            echo "stage={{inputs.parameters.stage}}"
            echo "{{inputs.parameters.message}}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep "{{inputs.parameters.sleepSeconds}}"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
