# Patch Deployment created by KServe RawDeployment
# Strategy Recreate:
#   - Delete all old pods BEFORE creating new pods
#   - Never have 2 pods in parallel
#   - Trade-off: ~30s downtime during deployment (acceptable for dev environment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skin-prediction-predictor
  namespace: model-serving
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
