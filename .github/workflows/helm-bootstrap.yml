name: "Helm Bootstrap - K8s Add-ons via Bastion SSH"
# Installation Order:
# 1. AWS Load Balancer Controller (needs to run first for NLB to be generated)
# 2. ingress-nginx (uses NLB via annotation)
# 3. ArgoCD (then take over GitOps)

on:
  workflow_dispatch:
    inputs:
      bastion_instance_id:
        description: "EC2 Instance ID của Bastion Host (vd: i-0abc123def456)"
        required: true
        type: string
      eks_cluster_name:
        description: "Tên EKS cluster"
        required: true
        default: "mlops-infr-dev-eks"
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-southeast-1"

jobs:
  # Job 1: Push ephemeral SSH key to Bastion via EC2 Instance Connect
  push-ssh-key:
    name: "Push ephemeral SSH Key to Bastion"
    runs-on: ubuntu-latest
    outputs:
      bastion_ip: ${{ steps.resolve.outputs.bastion_ip }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate ephemeral SSH key pair
        run: ssh-keygen -t ed25519 -f /tmp/bastion_key -N ""

      - name: Resolve Bastion AZ and Public IP
        id: resolve
        run: |
          INSTANCE_ID="${{ github.event.inputs.bastion_instance_id }}"

          AZ=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].Placement.AvailabilityZone" \
            --output text)

          BASTION_IP=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "${BASTION_IP}" ] || [ "${BASTION_IP}" = "None" ]; then
            echo "ERROR: No public IP found for instance ${INSTANCE_ID}."
            echo "Check if Bastion Host is running and has a public IP."
            exit 1
          fi

          echo "Availability Zone : ${AZ}"
          echo "Bastion Public IP  : ${BASTION_IP}"

          echo "AZ=${AZ}"                 >> $GITHUB_ENV
          echo "BASTION_IP=${BASTION_IP}" >> $GITHUB_ENV
          echo "bastion_ip=${BASTION_IP}" >> $GITHUB_OUTPUT

      - name: Push ephemeral public key via EC2 Instance Connect
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ github.event.inputs.bastion_instance_id }}" \
            --availability-zone "${AZ}" \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/bastion_key.pub
          echo "Key pushed to bastion (${BASTION_IP})"

      - name: Upload SSH private key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastion-ssh-key
          path: /tmp/bastion_key
          retention-days: 1

  # Job 2: SCP values.yaml lên Bastion → Run helm install for each add-on
  bootstrap-addons:
    name: "Bootstrap K8s Add-ons via Helm"
    runs-on: ubuntu-latest
    needs: push-ssh-key

    env:
      BASTION_IP: ${{ needs.push-ssh-key.outputs.bastion_ip }}
      CLUSTER_NAME: ${{ github.event.inputs.eks_cluster_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download SSH private key
        uses: actions/download-artifact@v4
        with:
          name: bastion-ssh-key
          path: /tmp/

      - name: Fix SSH key permissions
        run: chmod 600 /tmp/bastion_key

      - name: Wait for SSH to be available on Bastion
        run: |
          echo "Waiting for SSH on ${BASTION_IP}..."
          for i in $(seq 1 12); do
            if ssh -i /tmp/bastion_key \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   ubuntu@${BASTION_IP} "echo ready" 2>/dev/null; then
              echo "SSH ready after attempt ${i}"
              break
            fi
            echo "Attempt ${i}/12: not ready, retrying in 10s..."
            sleep 10
          done

      - name: SCP Helm values files to Bastion
        run: |
          # Create directory to receive files on bastion
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} \
            "mkdir -p ~/helm-values/ingress-nginx ~/helm-values/argocd"

          # Copy values.yaml from modules/ (no need to copy terraform code)
          scp -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            modules/ingress-nginx/values.yaml \
            ubuntu@${BASTION_IP}:~/helm-values/ingress-nginx/values.yaml

          scp -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            modules/argocd/values.yaml \
            ubuntu@${BASTION_IP}:~/helm-values/argocd/values.yaml

          echo "Helm values files synced to bastion"

      - name: Install tools on Bastion (kubectl + helm)
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} "
            set -euo pipefail

            # Install kubectl if not present
            if ! command -v kubectl &>/dev/null; then
              echo 'Installing kubectl...'
              KUBECTL_VERSION=\$(curl -fsSL https://dl.k8s.io/release/stable.txt)
              curl -fsSL \"https://dl.k8s.io/release/\${KUBECTL_VERSION}/bin/linux/amd64/kubectl\" \
                | sudo tee /usr/local/bin/kubectl > /dev/null
              sudo chmod +x /usr/local/bin/kubectl
              echo \"kubectl installed: \$(kubectl version --client 2>&1 | head -1)\"
            else
              echo \"kubectl already installed\"
            fi

            # Install helm if not present
            if ! command -v helm &>/dev/null; then
              echo 'Installing helm...'
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash
              echo \"helm installed: \$(helm version --short)\"
            else
              echo \"helm already installed: \$(helm version --short)\"
            fi
            "

      - name: Configure kubectl on Bastion
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} \
            "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
             AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
             AWS_DEFAULT_REGION=${AWS_REGION} \
             aws eks update-kubeconfig --region ${AWS_REGION} --name ${CLUSTER_NAME}"

      # 1. AWS Load Balancer Controller
      - name: "Install AWS Load Balancer Controller"
        id: install_lbc
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} "
            set -euo pipefail
            export AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'
            export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
            export AWS_DEFAULT_REGION='${AWS_REGION}'

            LBC_ROLE_ARN=\$(aws iam get-role \
              --role-name '${CLUSTER_NAME}-aws-load-balancer-controller' \
              --query 'Role.Arn' --output text)

            VPC_ID=\$(aws eks describe-cluster \
              --name '${CLUSTER_NAME}' \
              --query 'cluster.resourcesVpcConfig.vpcId' --output text)

            helm repo add eks https://aws.github.io/eks-charts 2>/dev/null || true
            helm repo update eks

            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              --namespace kube-system \
              --set clusterName='${CLUSTER_NAME}' \
              --set serviceAccount.create=true \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set \"serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn=\${LBC_ROLE_ARN}\" \
              --set region='${AWS_REGION}' \
              --set vpcId=\${VPC_ID} \
              --wait --timeout 5m

            kubectl rollout status deployment/aws-load-balancer-controller \
              -n kube-system --timeout=120s
            echo 'LBC installed OK'
            "

      # 2. ingress-nginx
      - name: "Install ingress-nginx"
        id: install_nginx
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} "
            set -euo pipefail

            # Replace template variable replica_count before passing to helm
            sed 's/\${replica_count}/2/g' ~/helm-values/ingress-nginx/values.yaml \
              > /tmp/ingress-nginx-values.yaml

            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx 2>/dev/null || true
            helm repo update ingress-nginx

            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx \
              --create-namespace \
              --version '4.14.3' \
              --values /tmp/ingress-nginx-values.yaml \
              --wait --timeout 10m

            kubectl rollout status deployment/ingress-nginx-controller \
              -n ingress-nginx --timeout=300s
            echo 'ingress-nginx installed OK'
            "

      # 3. ArgoCD
      - name: "Install ArgoCD"
        id: install_argocd
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} "
            set -euo pipefail

            helm repo add argo https://argoproj.github.io/argo-helm 2>/dev/null || true
            helm repo update argo

            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd \
              --create-namespace \
              --version '7.5.2' \
              --values ~/helm-values/argocd/values.yaml \
              --wait --timeout 10m

            kubectl rollout status deployment/argocd-server \
              -n argocd --timeout=300s
            echo 'ArgoCD installed OK'
            "

      # Verify the installation result
      - name: Verify all add-ons are healthy
        id: verify
        run: |
          ssh -i /tmp/bastion_key -o StrictHostKeyChecking=no \
            ubuntu@${BASTION_IP} "
            echo '==> AWS Load Balancer Controller'
            kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller

            echo '==> ingress-nginx (check EXTERNAL-IP = NLB DNS)'
            kubectl get pods -n ingress-nginx
            kubectl get svc ingress-nginx-controller -n ingress-nginx

            echo '==> ArgoCD'
            kubectl get pods -n argocd
            "

      - name: Post bootstrap summary
        if: always()
        run: |
          echo "## Helm Bootstrap — ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Add-on | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Load Balancer Controller | \`${{ steps.install_lbc.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ingress-nginx                | \`${{ steps.install_nginx.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD                       | \`${{ steps.install_argocd.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bastion Instance:** \`${{ github.event.inputs.bastion_instance_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**EKS Cluster:** \`${{ github.event.inputs.eks_cluster_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Next:** ArgoCD tiếp quản GitOps. Initial admin password:" >> $GITHUB_STEP_SUMMARY
          echo "> \`kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d\`" >> $GITHUB_STEP_SUMMARY
