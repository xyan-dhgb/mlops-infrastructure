name: "Helm Bootstrap - K8s Add-ons via SSM"
# Flow:
#  Phase 1 - EC2 Instance Connect (1 time, <30s): Install and start SSM Agent
#  Phase 2 - AWS SSM (no expire): helm install LBC, ingress-nginx, ArgoCD, NVIDIA, Monitoring

on:
  workflow_dispatch:
    inputs:
      eks_cluster_name:
        description: "Tên EKS cluster"
        required: true
        default: "mlops-infr-dev-eks"
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-southeast-1"

jobs:
  bootstrap:
    name: "Bootstrap K8s Add-ons via SSM"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Phase 1: EC2 Instance Connect → Start SSM Agent
      - name: "Phase 1: Start SSM Agent on Bastion"
        run: |
          echo "CLUSTER_NAME=${{ github.event.inputs.eks_cluster_name }}" >> "$GITHUB_ENV"
          chmod +x scripts/bash/phase1-start-ssm-agent.sh
          bash scripts/bash/phase1-start-ssm-agent.sh
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      # Phase 2: Helm installs via SSM
      - name: "Phase 2: Install K8s Add-ons"
        id: install_addons
        run: |
          chmod +x scripts/bash/ssm-run.sh scripts/bash/phase2-install-addons.sh
          bash scripts/bash/phase2-install-addons.sh
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          INSTANCE_ID: ${{ env.INSTANCE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      # Summary
      - name: Post bootstrap summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Helm Bootstrap (SSM) — ${{ github.event.inputs.environment }}

          | Add-on                       | Status |
          |------------------------------|--------|
          | AWS Load Balancer Controller | `${{ steps.install_addons.outcome }}` |
          | ingress-nginx                | `${{ steps.install_addons.outcome }}` |
          | ArgoCD                       | `${{ steps.install_addons.outcome }}` |
          | NVIDIA Device Plugin         | `${{ steps.install_addons.outcome }}` |
          | Monitoring (Prom/Grafana)    | `${{ steps.install_addons.outcome }}` |

          **Bastion:** `${{ env.INSTANCE_ID }}` &nbsp;|&nbsp; **EKS Cluster:** `${{ github.event.inputs.eks_cluster_name }}`
          EOF

# Tip — Get ArgoCD initial admin password:
# kubectl -n argocd get secret argocd-initial-admin-secret \
#   -o jsonpath='{.data.password}' | base64 -d
