name: "Terraform Apply - Deploy to DEV"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      plan_commit_sha:
        description: "Commit SHA from the CI plan run (find in PR comment)"
        required: true
        type: string

permissions:
  id-token: write # For AWS authentication
  contents: read # Checkout code
  pull-requests: write # For creating issues
  issues: write # For creating issues

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"
  TF_VAR_cluster_admin_principal_arns_json: ${{ vars.EKS_CLUSTER_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  terraform-apply:
    name: "Deploy Infrastructure to ${{ github.event.inputs.environment }}
      environment"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}

    steps:
      - name: Verify running from dev branch
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_name }}" != "dev" ]; then
            echo "❌ERROR: This workflow must be run from the 'dev' branch."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Branch check passed: running on 'dev'"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Download plan from S3
        id: plan
        run: |
          echo "Downloading plan for commit: ${{ github.event.inputs.plan_commit_sha }}"
          aws s3 cp s3://kltn-s3-tfstate-dev-env/plans/${{ github.event.inputs.environment }}/${{ github.event.inputs.plan_commit_sha }}/tfplan tfplan
          echo "✅ Plan downloaded successfully"

      - name: Verify downloaded plan
        id: verify_plan
        run: terraform show -no-color tfplan > /dev/null

      - name: Import existing AWS resources (if exist on AWS)
        id: import
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
        run: |
          # S3 Bucket
          BUCKET="kltn-mlops-mlflow-artifacts-dev"
          S3_ADDR="module.mlflow.module.s3.aws_s3_bucket.mlflow_artifact"

          # Check if bucket exists on AWS
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            # Check if bucket is already in state
            if ! terraform state show "${S3_ADDR}" > /dev/null 2>&1; then
              echo "→ Importing existing S3 bucket: ${BUCKET}"
              terraform import "${S3_ADDR}" "${BUCKET}"
            else
              echo "→ S3 bucket already in state, skip import"
            fi
          else
            echo "→ S3 bucket does not exist yet, skip import"
          fi

      - name: Terraform Apply
        id: apply
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color -input=false tfplan 2>&1 | tee apply.txt

      - name: Post apply summary to GitHub Step Summary
        if: always()
        run: |
          {
            cat << 'EOF'
          ## Terraform Apply — ${{ github.event.inputs.environment }} Environment

          | Step          | Result |
          |---------------|--------|
          | Init          | `${{ steps.init.outcome }}` |
          | Download Plan | `${{ steps.plan.outcome }}` |
          | Apply         | `${{ steps.apply.outcome }}` |

          **Plan SHA:** `${{ github.event.inputs.plan_commit_sha }}` &nbsp;|&nbsp; **Commit:** `${{ github.sha }}` &nbsp;|&nbsp; **By:** `${{ github.actor }}`

          <details><summary>Apply Output</summary>

          ```
          EOF
            cat apply.txt
            printf '```\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TF_ENVIRONMENT: ${{ github.event.inputs.environment }}
          WORKFLOW_TYPE: apply
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const notify = require('./.github/scripts/notify-failure.js');
            await notify({ github, context });
