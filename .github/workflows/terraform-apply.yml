name: "Terraform Apply - Deploy Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
      plan_commit_sha:
        description: "Commit SHA from the CI plan run (find in PR comment)"
        required: true
        type: string

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"
  APPLY_REPORTS_BUCKET: "checkov-reports-bucket"
  APPLY_REPORTS_PREFIX: "terraform-apply/${{ github.event.inputs.environment }}"
  TF_VAR_cluster_admin_principal_arns_json: ${{ vars.EKS_CLUSTER_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  apply-infra:
    name: "Apply Infrastructure"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}
    outputs:
      verify_branch_outcome: ${{ steps.verify_branch.outcome }}
      init_outcome: ${{ steps.init.outcome }}
      download_plan_outcome: ${{ steps.download_plan.outcome }}
      verify_plan_outcome: ${{ steps.verify_plan.outcome }}
      import_outcome: ${{ steps.import.outcome }}
      apply_outcome: ${{ steps.apply.outcome }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Verify branch guard"
        id: verify_branch
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_name }}" != "dev" ]; then
            echo "❌ ERROR: This workflow must be run from the 'dev' branch."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "✅ Branch check passed: running on 'dev'"

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Terraform Init"
        id: init
        run: terraform init -reconfigure

      - name: "Download plan from S3"
        id: download_plan
        run: |
          echo "Downloading plan for commit: ${{ github.event.inputs.plan_commit_sha }}"
          aws s3 cp \
            "s3://kltn-s3-tfstate-dev-env/plans/${{ github.event.inputs.environment }}/${{ github.event.inputs.plan_commit_sha }}/tfplan" \
            tfplan
          echo "✅ Plan downloaded successfully"

      - name: "Verify downloaded plan"
        id: verify_plan
        run: terraform show -no-color tfplan > /dev/null

      - name: "Import existing AWS resources (if exist on AWS)"
        id: import
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
        run: |
          BUCKET="kltn-mlops-mlflow-artifacts-dev"
          S3_ADDR="module.mlflow.module.s3.aws_s3_bucket.mlflow_artifact"

          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            if ! terraform state show "${S3_ADDR}" > /dev/null 2>&1; then
              echo "Importing existing S3 bucket: ${BUCKET}"
              terraform import "${S3_ADDR}" "${BUCKET}"
            else
              echo "S3 bucket already in state, skip import"
            fi
          else
            echo "S3 bucket does not exist yet, skip import"
          fi

      - name: "Terraform Apply"
        id: apply
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color -input=false tfplan 2>&1 | tee apply.txt

      - name: "Persist apply status snapshot"
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .cd
          cat > .cd/apply-status.json <<EOF
          {
            "job": "apply-infra",
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environment": "${{ github.event.inputs.environment }}",
            "plan_commit_sha": "${{ github.event.inputs.plan_commit_sha }}",
            "verify_branch_outcome": "${{ steps.verify_branch.outcome }}",
            "init_outcome": "${{ steps.init.outcome }}",
            "download_plan_outcome": "${{ steps.download_plan.outcome }}",
            "verify_plan_outcome": "${{ steps.verify_plan.outcome }}",
            "import_outcome": "${{ steps.import.outcome }}",
            "apply_outcome": "${{ steps.apply.outcome }}"
          }
          EOF

      - name: "Upload apply runtime artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cd/apply-status.json
            environments/${{ github.event.inputs.environment }}/apply.txt
            environments/${{ github.event.inputs.environment }}/tfplan
          if-no-files-found: warn

  apply-reporting:
    name: "Apply Reporting & Metrics"
    needs: apply-infra
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Download apply runtime artifacts"
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Prepare report destinations"
        run: |
          APPLY_REPORTS_S3_URI="s3://${{ env.APPLY_REPORTS_BUCKET }}/${{ env.APPLY_REPORTS_PREFIX }}/sha=${{ github.event.inputs.plan_commit_sha }}/run-id=${{ github.run_id }}/attempt=${{ github.run_attempt }}"
          echo "APPLY_REPORTS_S3_URI=${APPLY_REPORTS_S3_URI}" >> "$GITHUB_ENV"

      - name: "Collect apply run metadata"
        id: apply_metadata
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME || '';

            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.GITHUB_RUN_ID),
            });

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PLAN_COMMIT_SHA,
            });

            core.setOutput('branch', branch || workflowRun.head_branch || '');
            core.setOutput('run_started_at', workflowRun.run_started_at || '');
            core.setOutput(
              'plan_commit_timestamp',
              commit.commit?.committer?.date || commit.commit?.author?.date || ''
            );
        env:
          PLAN_COMMIT_SHA: ${{ github.event.inputs.plan_commit_sha }}

      - name: "Build apply pipeline metrics report"
        working-directory: ${{ github.workspace }}
        env:
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment }}
          PIPELINE_JOB_NAME: apply-infra
          PIPELINE_BRANCH: ${{ steps.apply_metadata.outputs.branch }}
          PIPELINE_SHA: ${{ github.event.inputs.plan_commit_sha }}
          RUN_STARTED_AT: ${{ steps.apply_metadata.outputs.run_started_at }}
          PLAN_COMMIT_SHA: ${{ github.event.inputs.plan_commit_sha }}
          PLAN_COMMIT_TIMESTAMP: ${{ steps.apply_metadata.outputs.plan_commit_timestamp }}
          APPLY_JOB_RESULT: ${{ needs.apply-infra.result }}
          VERIFY_BRANCH_OUTCOME: ${{ needs.apply-infra.outputs.verify_branch_outcome }}
          INIT_OUTCOME: ${{ needs.apply-infra.outputs.init_outcome }}
          DOWNLOAD_PLAN_OUTCOME: ${{ needs.apply-infra.outputs.download_plan_outcome }}
          VERIFY_PLAN_OUTCOME: ${{ needs.apply-infra.outputs.verify_plan_outcome }}
          IMPORT_OUTCOME: ${{ needs.apply-infra.outputs.import_outcome }}
          APPLY_OUTCOME: ${{ needs.apply-infra.outputs.apply_outcome }}
        run: |
          mkdir -p reports
          node .github/scripts/javascript/terraform/build-apply-pipeline-metrics.js \
            reports/cd-apply-metrics.json

      - name: "Upload apply reports to S3"
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          APPLY_LOG_PATH="environments/${{ github.event.inputs.environment }}/apply.txt"

          if [ -f "${APPLY_LOG_PATH}" ]; then
            aws s3 cp "${APPLY_LOG_PATH}" "${APPLY_REPORTS_S3_URI}/apply.txt" --content-type text/plain
          fi

          if [ -f .cd/apply-status.json ]; then
            aws s3 cp .cd/apply-status.json "${APPLY_REPORTS_S3_URI}/apply-status.json" --content-type application/json
          fi

          aws s3 cp reports/cd-apply-metrics.json "${APPLY_REPORTS_S3_URI}/cd-apply-metrics.json" --content-type application/json
          echo "Apply reports uploaded to ${APPLY_REPORTS_S3_URI}"

      - name: "Publish Terraform Apply summary"
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "⚠️" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🛑" ;;
              *) echo "❔" ;;
            esac
          }

          APPLY_LOG_PATH="environments/${{ github.event.inputs.environment }}/apply.txt"

          {
            echo "## 🚀 Terraform Apply Overview"
            echo ""
            echo "| Job | Outcome |"
            echo "|-----|---------|"
            echo "| Apply Infrastructure | $(status_icon '${{ needs.apply-infra.result }}') \`${{ needs.apply-infra.result }}\` |"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| Branch Guard | $(status_icon '${{ needs.apply-infra.outputs.verify_branch_outcome }}') \`${{ needs.apply-infra.outputs.verify_branch_outcome }}\` |"
            echo "| Terraform Init | $(status_icon '${{ needs.apply-infra.outputs.init_outcome }}') \`${{ needs.apply-infra.outputs.init_outcome }}\` |"
            echo "| Download Plan | $(status_icon '${{ needs.apply-infra.outputs.download_plan_outcome }}') \`${{ needs.apply-infra.outputs.download_plan_outcome }}\` |"
            echo "| Verify Plan | $(status_icon '${{ needs.apply-infra.outputs.verify_plan_outcome }}') \`${{ needs.apply-infra.outputs.verify_plan_outcome }}\` |"
            echo "| Import Existing Resources | $(status_icon '${{ needs.apply-infra.outputs.import_outcome }}') \`${{ needs.apply-infra.outputs.import_outcome }}\` |"
            echo "| Terraform Apply | $(status_icon '${{ needs.apply-infra.outputs.apply_outcome }}') \`${{ needs.apply-infra.outputs.apply_outcome }}\` |"
            echo ""
            echo "**Environment:** \`${{ github.event.inputs.environment }}\`"
            echo ""
            echo "**Plan Commit SHA:** \`${{ github.event.inputs.plan_commit_sha }}\`"
            echo ""
            echo "**Triggered by:** \`${{ github.actor }}\`"
            echo ""
            if [ -n "${APPLY_REPORTS_S3_URI:-}" ]; then
              echo "> ☁️ Apply reports: \`${APPLY_REPORTS_S3_URI}\`"
              echo "> 📈 Apply metrics JSON: \`${APPLY_REPORTS_S3_URI}/cd-apply-metrics.json\`"
              echo "> 🪵 Apply log: \`${APPLY_REPORTS_S3_URI}/apply.txt\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "${APPLY_LOG_PATH}" ] && [ '${{ needs.apply-infra.result }}' != 'success' ]; then
            {
              echo ""
              echo "<details><summary>Last 40 lines of apply output</summary>"
              echo ""
              echo '```'
              tail -n 40 "${APPLY_LOG_PATH}"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Notify on failure"
        if: always() && needs.apply-infra.result == 'failure'
        uses: actions/github-script@v7
        env:
          TF_ENVIRONMENT: ${{ github.event.inputs.environment }}
          WORKFLOW_TYPE: apply
          VERIFY_BRANCH_OUTCOME: ${{ needs.apply-infra.outputs.verify_branch_outcome }}
          INIT_OUTCOME: ${{ needs.apply-infra.outputs.init_outcome }}
          DOWNLOAD_PLAN_OUTCOME: ${{ needs.apply-infra.outputs.download_plan_outcome }}
          VERIFY_PLAN_OUTCOME: ${{ needs.apply-infra.outputs.verify_plan_outcome }}
          IMPORT_OUTCOME: ${{ needs.apply-infra.outputs.import_outcome }}
          APPLY_OUTCOME: ${{ needs.apply-infra.outputs.apply_outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const notify = require('./.github/scripts/javascript/terraform/notify-failure.js');
            await notify({ github, context });
