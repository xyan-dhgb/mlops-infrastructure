name: "Terraform Continuous Integration (CI) - PR validation"

on:
    pull_request:
        branches:
            - dev
        paths:
            # Only run when Terraform files actually change
            - "environments/dev/**"
            - "modules/**"

permissions:
    id-token: write
    contents: read # Checkout code
    pull-requests: write # Post plan comment on PR

env:
    TERRAFORM_VERSION: "1.10.5"
    AWS_REGION: "ap-southeast-1"
    WORKING_DIR: "environments/dev"

jobs:
    terraform-ci:
        name: "Infrastructure as Code Validataion"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.WORKING_DIR}}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                  aws-region: ${{ env.AWS_REGION}}

            - name: Terraform Init
              id: init
              run: terraform init -reconfigure # Initialize with backend reconfiguration

            - name: Terraform Format Check
              # Read only, no write
              id: fmt
              run: terraform fmt -check -recursive -diff ../..

            - name: Terraform Validate
              id: validate
              run: terraform validate -no-color

            - name: Terraform Plan
              id: plan
              run: terraform plan -no-color -input=false -out=tfplan.binary 2>&1 | tee plan.txt
              continue-on-error: true # Allow the comment step to still run on plan failure

            - name: Post plan output as PR comment
              uses: actions/github-script@v7
              if: github.event_name == 'pull_request'
              env:
                  PLAN: ${{ steps.plan.outputs.stdout }}
              with:
                  github-token: ${{ secrets.FINE_GAINED_GITHUB_TOKEN }}
                  script: |
                      script: |
                        const fs = require('fs');
                        const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
                        const maxLength = 65000;
                        const truncated = plan.length > maxLength
                        ? plan.substring(0, maxLength) + '\n\n...(truncated)'
                        : plan;

                        const output = `##  Terraform Plan — DEV Environment
                        | Step        | Result |
                        |-------------|--------|
                        | Format    | \`${{ steps.fmt.outcome }}\` |
                        | Validate  | \`${{ steps.validate.outcome }}\` |
                        | Plan      | \`${{ steps.plan.outcome }}\` |

                        <details><summary>Show Plan Output</summary>

                        \`\`\`hcl
                        ${truncated}
                        \`\`\`
                        </details>

                        >  *Generated by GitHub Actions — commit \`${{ github.sha }}\`*`;

                        // Find and replace existing bot comment (avoid spam on re-runs)
                        const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        });

                        const botComment = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Terraform Plan — DEV Environment')
                        );

                        if (botComment) {
                        await github.rest.issues.updateComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            comment_id: botComment.id,
                            body: output,
                        });
                        } else {
                        await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            body: output,
                        });
                        }
            - name: Fail if plan failed
              if: steps.plan.outcome == 'failure'
              run: exit 1
