name: "Terraform CI - PR Validation"

on:
  pull_request:
    branches:
      - dev
    paths:
      - "environments/dev/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"
  WORKING_DIR: "environments/dev"
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  terraform-ci:
    name: "Infrastructure as Code Validation"
    runs-on: [self-hosted, bastion]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ kubeconfig updated"

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff ../..
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Upload plan to S3
        if: steps.plan.outcome == 'success'
        run: |
          aws s3 cp tfplan s3://kltn-tfstate-dev/plans/dev/${{ github.sha }}/tfplan
          echo "✅ Plan uploaded: plans/dev/${{ github.sha }}/tfplan"

      - name: Post plan comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let plan = '';
            try {
              plan = fs.readFileSync('environments/dev/plan.txt', 'utf8');
            } catch (e) {
              plan = '(không đọc được output)';
            }
            const maxLen = 65000;
            const planText = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n...(truncated)'
              : plan;

            const fmtIcon  = '${{ steps.fmt.outcome }}'      === 'success' ? '✅' : '⚠️';
            const valIcon  = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planIcon = '${{ steps.plan.outcome }}'     === 'success' ? '✅' : '❌';

            const body = `## Terraform Plan — DEV Environment

            | Step     | Result |
            |----------|--------|
            | Format   | ${fmtIcon} \`${{ steps.fmt.outcome }}\` |
            | Validate | ${valIcon} \`${{ steps.validate.outcome }}\` |
            | Plan     | ${planIcon} \`${{ steps.plan.outcome }}\` |

            <details><summary>📄 Show Plan Output</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`
            </details>

            ---
            ${ '${{ steps.plan.outcome }}' === 'success'
              ? `> ✅ **Plan OK.** To apply, run the workflow [Terraform Apply](../.github/workflows/terraform-apply.yml) with:\n> - **Environment:** \`dev\`\n> - **Plan Commit SHA:** \`${{ github.sha }}\``
              : `> ❌ **Plan FAILED.** Please check the output above and fix the error before merging.`
            }

            > *Commit: \`${{ github.sha }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan — DEV Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail pipeline if validate or plan failed
        if: steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "❌ Pipeline failed:"
          [ "${{ steps.validate.outcome }}" == "failure" ] && echo "  - Terraform Validate FAILED"
          [ "${{ steps.plan.outcome }}"     == "failure" ] && echo "  - Terraform Plan FAILED"
          exit 1
