name: "Terraform CI - PR Validation"

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/scripts/**"
      - ".github/workflows/terraform-ci.yml"
      - ".checkov.yaml"
      - "environments/dev/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: "1.10.5"
  CHECKOV_VERSION: "3.2.521"
  AWS_REGION: "ap-southeast-1"
  WORKING_DIR: "environments/dev"
  CHECKOV_REPORTS_BUCKET: "checkov-reports-bucket"
  CHECKOV_REPORTS_PREFIX: ${{ vars.CHECKOV_REPORTS_PREFIX || 'terraform-ci/dev' }}
  TF_VAR_cluster_admin_principal_arns_json: ${{ vars.EKS_CLUSTER_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  terraform-ci:
    name: "Infrastructure as Code Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set up Python for Checkov
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install "checkov==${{ env.CHECKOV_VERSION }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Import existing AWS resources before plan
        id: import
        env:
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        run: |
          set -euo pipefail

          CLUSTER_NAME=$(awk -F'"' '/^cluster_name[[:space:]]*=/{print $2}' terraform.tfvars)
          NODEGROUP_NAME="${CLUSTER_NAME}-node-group"

          S3_BUCKET="kltn-mlops-mlflow-artifacts-dev"
          S3_ADDR="module.mlflow.module.s3.aws_s3_bucket.mlflow_artifact"
          NODEGROUP_ADDR="module.eks.aws_eks_node_group.main"
          OIDC_ADDR="module.eks.aws_iam_openid_connect_provider.eks"

          if aws s3api head-bucket --bucket "${S3_BUCKET}" 2>/dev/null; then
            if ! terraform state show "${S3_ADDR}" >/dev/null 2>&1; then
              echo "Importing existing S3 bucket: ${S3_BUCKET}"
              terraform import "${S3_ADDR}" "${S3_BUCKET}"
            fi
          fi

          if aws eks describe-nodegroup \
            --cluster-name "${CLUSTER_NAME}" \
            --nodegroup-name "${NODEGROUP_NAME}" >/dev/null 2>&1; then
            if ! terraform state show "${NODEGROUP_ADDR}" >/dev/null 2>&1; then
              echo "Importing existing EKS node group: ${NODEGROUP_NAME}"
              terraform import "${NODEGROUP_ADDR}" "${CLUSTER_NAME}:${NODEGROUP_NAME}"
            fi
          fi

          OIDC_ISSUER=$(aws eks describe-cluster \
            --name "${CLUSTER_NAME}" \
            --query "cluster.identity.oidc.issuer" \
            --output text 2>/dev/null || true)

          if [ -n "${OIDC_ISSUER}" ] && [ "${OIDC_ISSUER}" != "None" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            OIDC_PROVIDER_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/${OIDC_ISSUER#https://}"

            if aws iam get-open-id-connect-provider \
              --open-id-connect-provider-arn "${OIDC_PROVIDER_ARN}" >/dev/null 2>&1; then
              if ! terraform state show "${OIDC_ADDR}" >/dev/null 2>&1; then
                echo "Importing existing IAM OIDC provider"
                terraform import "${OIDC_ADDR}" "${OIDC_PROVIDER_ARN}"
              fi
            fi
          fi

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff ../..
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        env:
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Upload plan to S3
        if: steps.plan.outcome == 'success'
        run: |
          aws s3 cp tfplan s3://kltn-s3-tfstate-dev-env/plans/dev/${{ github.sha }}/tfplan
          echo "Plan uploaded: plans/dev/${{ github.sha }}/tfplan"

      - name: Run Checkov
        if: always()
        id: checkov
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p reports
          set -o pipefail
          checkov \
            --config-file .checkov.yaml \
            --directory . \
            --output cli \
            --output json \
            --output junitxml \
            --output-file-path console,reports/checkov.json,reports/checkov.junit.xml | tee reports/checkov-cli.log

      - name: Prepare Checkov report destinations
        if: always() && steps.checkov.outcome != 'skipped'
        run: |
          CHECKOV_S3_URI="s3://${{ env.CHECKOV_REPORTS_BUCKET }}/${{ env.CHECKOV_REPORTS_PREFIX }}/sha=${{ github.sha }}/run-id=${{ github.run_id }}/attempt=${{ github.run_attempt }}"
          echo "CHECKOV_REPORTS_S3_URI=${CHECKOV_S3_URI}" >> "$GITHUB_ENV"

      - name: Build Checkov summary
        if: always() && steps.checkov.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        env:
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          CHECKOV_ARTIFACT_NAME: checkov-junit-${{ github.sha }}
        run: |
          node .github/scripts/javascript/checkov/build-checkov-summary.js \
            reports/checkov.json \
            reports/checkov-summary.json

      - name: Upload Checkov JUnit artifact
        if: always() && steps.checkov.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: checkov-junit-${{ github.sha }}
          path: |
            reports/checkov.junit.xml
          if-no-files-found: warn

      - name: Upload Checkov JSON reports to S3
        if: always() && steps.checkov.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        run: |
          aws s3 cp reports/checkov-cli.log "${CHECKOV_REPORTS_S3_URI}/checkov-cli.log" --content-type text/plain
          aws s3 cp reports/checkov.json "${CHECKOV_REPORTS_S3_URI}/checkov.json" --content-type application/json
          aws s3 cp reports/checkov-summary.json "${CHECKOV_REPORTS_S3_URI}/checkov-summary.json" --content-type application/json
          echo "Checkov JSON reports uploaded to ${CHECKOV_REPORTS_S3_URI}"

      - name: Publish Checkov Step Summary
        if: always() && steps.checkov.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        run: |
          node .github/scripts/javascript/checkov/write-checkov-step-summary.js reports/checkov-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          PLAN_FILE: environments/dev/plan.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const postComment = require('./.github/scripts/javascript/terraform/post-plan-comment.js');
            await postComment({ github, context });

      - name: Post Checkov comment on PR
        if: github.event_name == 'pull_request' && always() && steps.checkov.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          CHECKOV_SUMMARY_FILE: reports/checkov-summary.json
          CHECKOV_ARTIFACT_NAME: checkov-junit-${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const postComment = require('./.github/scripts/javascript/checkov/post-checkov-comment.js');
            await postComment({ github, context });

      - name: Fail pipeline if validate, plan, or Checkov failed
        if: steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure' ||
          steps.checkov.outcome == 'failure'
        run: |
          echo "Pipeline failed:"
          [ "${{ steps.validate.outcome }}" == "failure" ] && echo "  - Terraform Validate FAILED"
          [ "${{ steps.plan.outcome }}" == "failure" ] && echo "  - Terraform Plan FAILED"
          [ "${{ steps.checkov.outcome }}" == "failure" ] && echo "  - Checkov FAILED"
          exit 1
