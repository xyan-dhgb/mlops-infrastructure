name: "Terraform CI - PR Validation"

on:
  pull_request:
    branches:
      - dev
    paths:
      - "environments/dev/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"
  WORKING_DIR: "environments/dev"
  TF_VAR_cluster_admin_principal_arns: ${{ vars.EKS_CLUSTER_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  terraform-ci:
    name: "Infrastructure as Code Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff ../..
        continue-on-error: true

      - name: Terraform Validate
        env:
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        env:
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Upload plan to S3
        if: steps.plan.outcome == 'success'
        run: |
          aws s3 cp tfplan s3://kltn-s3-tfstate-dev-env/plans/dev/${{ github.sha }}/tfplan
          echo "✅ Plan uploaded: plans/dev/${{ github.sha }}/tfplan"

      - name: Post plan comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          PLAN_FILE: environments/dev/plan.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const postComment = require('./.github/scripts/post-plan-comment.js');
            await postComment({ github, context });

      - name: Fail pipeline if validate or plan failed
        if: steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "❌ Pipeline failed:"
          [ "${{ steps.validate.outcome }}" == "failure" ] && echo "  - Terraform Validate FAILED"
          [ "${{ steps.plan.outcome }}"     == "failure" ] && echo "  - Terraform Plan FAILED"
          exit 1
