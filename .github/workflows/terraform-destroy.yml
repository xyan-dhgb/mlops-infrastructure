name: "Terraform Destroy - DEV Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      confirm_destroy:
        description: 'Type "destroy" to confirm. This action is IRREVERSIBLE.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"

jobs:
  terraform-destroy:
    name: "Destroy Infrastructure — ${{ github.event.inputs.environment }} environment"
    runs-on: [self-hosted, bastion]
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}

    steps:
      - name: Verify running from dev branch
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_name }}" != "dev" ]; then
            echo "ERROR: This workflow must be run from the 'dev' branch."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "Branch check passed: running on 'dev'"

      - name: Verify destroy confirmation
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "ERROR: Confirmation failed. You must type 'destroy' exactly to proceed."
            echo "You entered: '${{ github.event.inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "Destroy confirmation accepted."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name mlops-infr-dev-eks

      - name: Cleanup Kubernetes-managed AWS resources
        run: |
          echo "==> Delete ingress-nginx Service (removes NLB)"
          kubectl delete svc -n ingress-nginx ingress-nginx-controller --ignore-not-found --timeout=120s

          echo "==> Wait for NLB to be fully deleted by AWS LB Controller"
          sleep 60

          echo "==> Delete all Helm releases (ingress-nginx, argocd...)"
          helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found || true
          helm uninstall argocd -n argocd --ignore-not-found || true

          echo "==> Cleanup done"

      - name: Terraform Plan Destroy
        id: plan
        run: terraform plan -destroy -no-color -input=false 2>&1 | tee destroy-plan.txt

      - name: Terraform Destroy
        id: destroy
        run: terraform destroy -auto-approve -no-color -input=false 2>&1 | tee destroy.txt

      - name: Post destroy summary to GitHub Step Summary
        if: always()
        run: |
          echo "## Terraform Destroy — ${{ github.event.inputs.environment }} Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
          echo "> Infrastructure has been destroyed. This action is irreversible." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step           | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Init           | \`${{ steps.init.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan Destroy   | \`${{ steps.plan.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroy        | \`${{ steps.destroy.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Destroy Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat destroy.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform Destroy FAILED on ${{ github.event.inputs.environment }} — ${sha}`,
              body: `## Terraform Destroy Failed\n\n**Environment:** \`${{ github.event.inputs.environment }}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Commit:** \`${context.sha}\`\n**Triggered by:** \`${context.actor}\`\n\n[View failed run](${runUrl})\n\n> Infrastructure may be in a partial state. Manual intervention required.`,
              labels: ["terraform", "infrastructure", "bug"],
            });
