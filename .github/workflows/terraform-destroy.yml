name: "Terraform Destroy - DEV Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      confirm_destroy:
        description: 'Type "destroy" to confirm. This action is IRREVERSIBLE.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "ap-southeast-1"
  TF_VAR_cluster_admin_principal_arns_json: ${{ vars.EKS_CLUSTER_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  terraform-destroy:
    name: "Destroy Infrastructure — ${{ github.event.inputs.environment }} environment"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}

    steps:
      - name: Verify running from dev branch
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_name }}" != "dev" ]; then
            echo "ERROR: This workflow must be run from the 'dev' branch."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "Branch check passed: running on 'dev'"

      - name: Verify destroy confirmation
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "ERROR: Confirmation failed. You must type 'destroy' exactly to proceed."
            echo "You entered: '${{ github.event.inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "Destroy confirmation accepted."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Terraform Plan Destroy
        id: plan
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        run: |
          set -o pipefail
          terraform plan -destroy -no-color -input=false 2>&1 | tee destroy-plan.txt

      - name: Terraform Destroy
        id: destroy
        env:
          TF_VAR_github_pat: ${{ secrets.RUNNER_PATH }}
          TF_VAR_BASTION_PUBLIC_KEY: ${{ secrets.BASTION_PUBLIC_KEY }}
          TF_VAR_MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
        run: |
          set -o pipefail
          terraform destroy -auto-approve -no-color -input=false 2>&1 | tee destroy.txt

      - name: Post destroy summary to GitHub Step Summary
        if: always()
        run: |
          {
            cat << 'EOF'
          ## Terraform Destroy — ${{ github.event.inputs.environment }} Environment

          > [!CAUTION]
          > Infrastructure has been destroyed. This action is irreversible.

          | Step         | Result |
          |--------------|--------|
          | Init         | `${{ steps.init.outcome }}` |
          | Plan Destroy | `${{ steps.plan.outcome }}` |
          | Destroy      | `${{ steps.destroy.outcome }}` |

          **Commit:** `${{ github.sha }}` &nbsp;|&nbsp; **By:** `${{ github.actor }}`

          <details><summary>Destroy Output</summary>

          ```
          EOF
            cat destroy.txt
            printf '```\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TF_ENVIRONMENT: ${{ github.event.inputs.environment }}
          WORKFLOW_TYPE: destroy
          REF_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const notify = require('./.github/scripts/javascript/terraform/notify-failure.js');
            await notify({ github, context });
