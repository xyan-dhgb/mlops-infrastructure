# Helm values for community-charts/mlflow
# Placeholders được replace bởi sed trong helm-bootstrap.yml:
#   __IRSA_ROLE_ARN__  → IAM Role ARN cho IRSA
#   __S3_BUCKET__      → Tên S3 bucket artifacts
#   __AWS_REGION__     → AWS region (vd: ap-southeast-1)
#   __DB_HOST__        → PostgreSQL DB host
#   __DB_PASS__        → PostgreSQL DB password

serviceAccount:
  create: true
  name: "mlflow-sa"
  annotations:
    eks.amazonaws.com/role-arn: "__IRSA_ROLE_ARN__"

backendStore:
  databaseMigration: true
  postgres:
    enabled: true
    host: "__DB_HOST__"
    port: 5432
    database: "mlflow"
    user: "mlflow"
    password: "__DB_PASS__"

artifactRoot:
  proxiedArtifactStorage: true
  s3:
    enabled: true
    bucket: "__S3_BUCKET__"
    awsRegion: "__AWS_REGION__"

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
