# Basic ArgoCD values

server:
  service:
    type: ClusterIP

# Disable High Availability for dev environment to save resources
redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

configs:
  cm:
    # FIX: Kubernetes 1.28+ added .status.terminatingReplicas to StatefulSet.
    # ArgoCD 7.5.2 schema does not declare this field → ComparisonError with ServerSideApply.
    # Global ignoreDifferences here fixes it at the comparison algorithm level
    # (Application-level ignoreDifferences is applied AFTER comparison and cannot fix this).
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jqPathExpressions:
      - .status.terminatingReplicas

  # Register OCI Helm repositories so ArgoCD can pull charts from OCI registries
  repositories:
    kserve-charts:
      type: helm
      name: kserve-charts
      url: oci://ghcr.io/kserve/charts
      enableOCI: "true"
