# Helm values for argoproj/argo-workflows.
# The UI is kept internal; use kubectl/SSM port-forward from inside the VPC when needed.

crds:
  install: true
  keep: true
  full: true

singleNamespace: false

workflow:
  namespace: argo-workflows

controller:
  workflowNamespaces:
    - argo-workflows
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: false
  # workflow-controller-configmap: inject artifact repository config so archiveLogs
  # can upload container logs to S3 (fixes "unable to retrieve container logs for containerd://")
  config: |
    artifactRepository:
      archiveLogs: true
      s3:
        bucket: kltn-argo-workflows-logs
        region: ap-southeast-1
        useSDKCreds: true
        insecure: false
        keyFormat: >-
          {{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{workflow.name}}/{{pod.name}}/main.log
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

server:
  enabled: true
  authModes:
    - server
  secure: false
  serviceType: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
