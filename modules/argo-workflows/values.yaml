# Helm values for argoproj/argo-workflows.
# The UI is kept internal; use kubectl/SSM port-forward from inside the VPC when needed.

crds:
  install: true
  keep: true
  full: true

singleNamespace: false

workflow:
  namespace: argo-workflows

controller:
  workflowNamespaces:
    - argo-workflows
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: false
  # Stream container logs to S3 during execution so they remain accessible
  # after the pod is GC'd (fixes "unable to retrieve container logs for containerd://")
  workflowDefaults:
    spec:
      archiveLogs: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# Global artifact repository - used by archiveLogs to persist container logs
artifactRepository:
  archiveLogs: true
  s3:
    bucket: kltn-argo-workflows-logs
    region: ap-southeast-1
    # Use IRSA (IAM Roles for Service Accounts) - no static credentials needed
    useSDKCreds: true
    insecure: false
    # Key prefix pattern: <workflow-name>/<pod-name>/main.log
    keyFormat: "{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/\
      {{workflow.creationTimestamp.d}}/{{workflow.name}}/{{pod.name}}/main.log"

server:
  enabled: true
  authModes:
    - server
  secure: false
  serviceType: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
