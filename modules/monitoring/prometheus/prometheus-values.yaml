# This is for Prometheus K8s namespace

# Disable Grafana because it will be installed in a separate namespace
grafana:
  enabled: false

# Prometheus configuration
# The Prometheus and Alertmanager configuration utilizes the Node's ephemeral storage (Node's disk/RAM) instead of requiring AWS to allocate expensive EBS (Persistent Volume) hard drives.
prometheus:
  prometheusSpec:
    # Ephemeral storage - no PVC/EBS
    storageSpec: {}
    # Only store metrics data for 1 day
    retention: 1d

# Alertmanager configuration
alertmanager:
  serviceAccount:
    create: true
    name: alertmanager-sns
    annotations:
      eks.amazonaws.com/role-arn: __ALERTMANAGER_IRSA_ROLE_ARN__
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: eks-sns
          matchers:
            - team = "platform"
    receivers:
      - name: "null"
      - name: eks-sns
        sns_configs:
          - api_url: 'https://sns.__AWS_REGION__.amazonaws.com'
            topic_arn: __ALERT_SNS_TOPIC_ARN__
            sigv4:
              region: __AWS_REGION__
            subject: '[EKS] {{ .CommonLabels.alertname }}'
            send_resolved: true
  alertmanagerSpec:
    # Ephemeral storage - no PVC/EBS
    storage:
      emptyDir: {}
